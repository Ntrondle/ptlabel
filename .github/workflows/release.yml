name: Release build

# Publishing a GitHub release builds PTLabel.dmg on macOS and attaches it.
# Run manually (Actions → Release build → Run workflow) to get the DMG as an artifact.
# Pushes to main run it too, to keep the Rust cache warm: a release runs on its tag, and a tag can
# only restore caches saved on main. Without them every release compiled all ~480 crates twice.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_PROFILE_DEV_DEBUG: 0 # tests need no debuginfo: faster to build, smaller cache

jobs:
  # Tests and the release build share no artifacts (dev vs release profile), so they run side by side.
  test:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test

  macos:
    runs-on: macos-latest # Apple Silicon
    outputs:
      dmg: ${{ steps.dmg.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build app + DMG
        run: scripts/bundle.sh --dmg

      - name: Name the DMG
        id: dmg
        run: |
          V="${GITHUB_REF_NAME}"
          [[ "$GITHUB_EVENT_NAME" == "release" ]] || V="$(git rev-parse --short HEAD)"
          F="PTLabel-${V}-macos-arm64.dmg"
          cp target/PTLabel.dmg "$F"
          echo "file=$F" >> "$GITHUB_OUTPUT"
          ls -l "$F"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.file }}
          path: ${{ steps.dmg.outputs.file }}

  # Only a tested build goes on the release (the app updates itself from it).
  attach:
    if: github.event_name == 'release'
    needs: [test, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos.outputs.dmg }}
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ needs.macos.outputs.dmg }}" --clobber --repo "$GITHUB_REPOSITORY"
