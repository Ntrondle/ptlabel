[package]
name = "ptlabel"
version = "2.0.0"
edition = "2024"
description = "Fast label app for Brother PT-P710BT (Bluetooth) and PT-E550W (Wi-Fi)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "persistence", "default_fonts", "clipboard", "system_fonts"] }
egui = { version = "0.37", default-features = false }
# Metal renderer only. eframe's "wgpu" feature would also pull in the Vulkan/GL/DX12/WebGPU backends;
# glow (OpenGL) keeps ~45 MB more window buffers alive on macOS than a CAMetalLayer.
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
cosmic-text = "0.19"
calamine = { version = "0.38", default-features = false }
datamatrix = "0.3"
qrcode = { version = "0.15", default-features = false }
barcoders = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serialport = { version = "4.10", default-features = false }
mdns-sd = "0.22"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Updates from GitHub releases (as in SMDMAP).
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem"] }

[profile.release]
# Small and still fast: size-optimised, whole-program LTO, no unwinding tables.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
