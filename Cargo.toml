[package]
name = "ptlabel"
version = "2.4.0"
edition = "2024"
description = "Fast label app for Brother P-touch printers (USB, Bluetooth, Wi-Fi)"

[features]
default = []
# Yellow dev build: distinct icon/profile, live-reloaded dev-ui.json, in-app UI inspector, no auto-update.
dev = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "persistence", "default_fonts", "clipboard", "system_fonts"] }
egui = { version = "0.37", default-features = false }
cosmic-text = "0.19"
calamine = { version = "0.38", default-features = false }
datamatrix = "0.3"
qrcode = { version = "0.15", default-features = false }
barcoders = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
mdns-sd = "0.22"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Updates from GitHub releases (as in SMDMAP).
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal renderer only. eframe's "wgpu" feature would also pull in the Vulkan/GL/DX12/WebGPU backends;
# glow (OpenGL) keeps ~45 MB more window buffers alive on macOS than a CAMetalLayer.
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem"] }
# PT-P710BT: the RFCOMM channel is opened directly (src/transport/rfcomm.rs).
objc2-io-bluetooth = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothDevice", "IOBluetoothObject", "IOBluetoothRFCOMMChannel", "IOBluetoothSDPServiceRecord", "IOBluetoothSDPUUID"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "gles"] }
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
serialport = { version = "4.10", default-features = false }

[profile.release]
# Small and still fast: size-optimised, thin LTO (fat makes the binary ~25% smaller but links
# ~2.5x slower, on one core), no unwinding tables.
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
